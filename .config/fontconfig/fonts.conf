<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--  Firefox asks for these names on its own and cannot be told otherwise:
        font.* preferences are not settable through its policy engine.
        Map both names onto the font that is actually installed.  -->
  <match target="pattern">
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Apple Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Twemoji Mozilla</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Apple Color Emoji</string></edit>
  </match>

  <!--  Prefer Fluent Emoji for sans-serif  -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
      <family>JoyPixels</family>
    </prefer>
  </alias>

  <!--  Prefer Fluent Emoji for serif  -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
      <family>JoyPixels</family>
    </prefer>
  </alias>

  <!--  Prefer Fluent Emoji for monospace (Terminals)  -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>CommitMono Nerd Font</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
      <family>JoyPixels</family>
    </prefer>
  </alias>

  <match target="font">
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="embeddedbitmap">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="autohint">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
    <edit mode="assign" name="lcdfilter">
      <const>lcddefault</const>
    </edit>
    <edit mode="assign" name="rgba">
      <const>rgb</const>
    </edit>
  </match>
</fontconfig>
